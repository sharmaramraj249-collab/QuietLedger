name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quiet-ledger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.15", enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: uv sync --project backend --all-groups
      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> $GITHUB_PATH
          compact update 0.31.1
          compact compile --version
      - run: npm run contract:compile
      - run: npm run contract:artifacts:check
      - run: npm run lint && npm test && npm run build
      - run: uv run --project backend ruff check .
      - run: uv run --directory backend pytest
      - name: Verify Alembic migration lifecycle
        run: |
          DATABASE_URL_UNPOOLED=sqlite+aiosqlite:///./migration-smoke.db uv run --directory backend alembic upgrade head
          DATABASE_URL_UNPOOLED=sqlite+aiosqlite:///./migration-smoke.db uv run --directory backend alembic downgrade base
